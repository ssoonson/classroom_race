<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#202c2a"/>
  <title>우리 반 콩콩 달리기</title>
  <link rel="stylesheet" href="./css/base.css"/>
  <link rel="stylesheet" href="./css/layout.css"/>
  <link rel="stylesheet" href="./css/start-screen.css"/>
  <link rel="stylesheet" href="./css/settings.css"/>
  <link rel="stylesheet" href="./css/result.css"/>
</head>
<body>
  <!-- 각 영역의 내용은 js/ui/ 아래 모듈이 채웁니다. 이 파일은 자리만 잡아 둡니다. -->
  <div id="app">
    <header class="topbar" id="topbar"></header>             <!-- js/ui/topbar.js -->
    <main class="layout">
      <section class="arena">
        <div id="canvasMount"></div>                         <!-- js/game/stage.js (3D) -->
        <div id="threeError" class="error-banner" hidden></div>
        <div id="hud"></div>                                 <!-- js/ui/hud.js -->
        <div id="startScreen"></div>                         <!-- js/ui/start-screen.js -->
      </section>
      <aside class="side">
        <div id="cameraPanel" class="panel"></div>           <!-- js/ui/camera-panel.js -->
        <div id="rankingPanel" class="panel"></div>          <!-- js/ui/ranking-panel.js -->
        <div class="panel tip">
          <strong>게임 방법</strong>
          <p>교사 PC에서 학생 전원이 자동으로 경주합니다. 순위는 매 경기 공정하게 추첨되며, 중간에는 추월과 장애물 연출이 나타납니다.</p>
        </div>
      </aside>
    </main>
    <div id="settings"></div>                                <!-- js/ui/settings/ -->
    <div id="result"></div>                                  <!-- js/ui/result.js -->
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
